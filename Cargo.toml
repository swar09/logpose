[package]
name = "url-shortner"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
diesel = { version = "2.3.11", features = ["chrono", "postgres", "serde_json", "uuid"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
pq-sys = { version = "0.7.5", features = ["bundled_without_openssl"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
md-5 = "0.11.0"
hex = "0.4.3"
base62 = "2.2.4"
fpe = "0.6.1"
aes = "0.8.4"

[workspace]

