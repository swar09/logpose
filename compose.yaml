services:
  server-1:
    build:
      context: .
      target: final
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_ADDR: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - postgres
      - redis

  server-2:
    build:
      context: .
      target: final
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_ADDR: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - postgres
      - redis

  server-3:
    build:
      context: .
      target: final
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_ADDR: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "80:80"
    environment:
      - NGINX_USER=${NGINX_USER}
      - NGINX_PASSWORD=${NGINX_PASSWORD}
    command: >
      /bin/sh -c "
      apk add --no-cache openssl &&
      echo \"Generating htpasswd...\" &&
      echo \"$${NGINX_USER}:$(openssl passwd -apr1 $${NGINX_PASSWORD})\" > /etc/nginx/.htpasswd &&
      exec nginx -g 'daemon off;'
      "
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server-1
      - server-2
      - server-3

  postgres:
    image: postgres:17
    container_name: url-shortner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: